{% extends "../base.html" %}

{% block title %}Clientes{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Clientes</h1>
    <a href="{% url 'cliente_create' %}" class="btn btn-primary">+ Agregar cliente</a>
  </div>

  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th>Nombre</th>
        <th style="width: 220px;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for cliente in clientes %}
        <tr>
          <td>{{ cliente.nombre }}</td>
          <td>
            <a href="{% url 'cliente_update' cliente.pk %}" class="btn btn-sm btn-outline-secondary">Editar</a>
            <a href="{% url 'cliente_delete' cliente.pk %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="5" class="text-center text-muted">No hay clientes registrados todavia.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
